<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penyimpanan Barang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>📦 Aplikasi Inventaris Barang</h2>

        <!-- Form Tambah/Edit Barang -->
        <div class="card">
            <h3 id="form-title">Tambah Barang Baru</h3>
            <form id="item-form">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label for="nama">Nama Barang:</label>
                    <input type="text" id="nama" required placeholder="Contoh: Laptop Asus">
                </div>
                <div class="form-group">
                    <label for="kategori">Kategori:</label>
                    <input type="text" id="kategori" required placeholder="Contoh: Elektronik">
                </div>
                <div class="form-group">
                    <label for="jumlah">Jumlah:</label>
                    <input type="number" id="jumlah" required min="1" placeholder="Contoh: 10">
                </div>
                <button type="submit" id="btn-simpan" class="btn-primary">Simpan Barang</button>
                <button type="button" id="btn-batal" class="btn-secondary" style="display:none;">Batal</button>
            </form>
        </div>

        <!-- Tabel Daftar Barang -->
        <div class="card">
            <h3>Daftar Barang Tersimpan</h3>
            <table class="item-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Barang</th>
                        <th>Kategori</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="item-list">
                    <!-- Data akan dimuat otomatis oleh JavaScript dari Firebase -->
                    <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script Utama -->
    <script type="module" src="script.js"></script>
</body>
</html>
